# Keshav Jangid — Portfolio
# Build step: restore the original single-file site (Aug 27 deploy) and add
# the resume download buttons, then serve the generated index.html.
[build]
  command = "python3 build.py"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
